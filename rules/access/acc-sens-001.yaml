id: ACC-SENS-001
lens: access
category: link and instruction clarity
severity: medium
match_type: regex
patterns:
  - '\b(?:click|press|tap|select|see|find|use|choose) the (?:red|green|blue|yellow|orange|purple|gray|grey) (?:button|link|box|icon|text|tab|field|arrow)\b'
  - '\blisten for the (?:beep|tone|chime|bell|alarm)\b'
applies_to: [all]
why: >
  Instructions that depend only on color or sound fail people who are
  color-blind, blind, or Deaf, and anyone using a screen reader.
who_is_affected: People who are blind, color-blind, Deaf, or hard of hearing
suggestion: >
  Name the control by its label, for example 'Select the Submit button'.
  Pair any sound with a visible signal.
source_title: WCAG 2.2, Success Criterion 1.3.3 Sensory Characteristics
source_url: https://www.w3.org/WAI/WCAG22/Understanding/sensory-characteristics.html
examples:
  should_flag:
    - When you are done, click the green button.
    - Listen for the beep, then speak your name.
  should_not_flag:
    - When you are done, select the Submit button.
    - Our team wears green shirts on Fridays.
