id: ACC-LINK-001
lens: access
category: link and instruction clarity
severity: medium
match_type: regex
patterns:
  - '\bclick here\b'
  - '\bclick (?:on )?this link\b'
  - '\bread more\b(?=\s*(?:[.!:)\]>]|$))'
applies_to: [all]
why: >
  Screen reader users often jump from link to link. A link that only
  says 'click here' or 'read more' gives no clue where it goes.
who_is_affected: Screen reader users and people with cognitive disabilities
suggestion: >
  Make the link text name its destination, for example 'Apply for the
  warehouse lead role' or 'Read the full refund policy'.
source_title: WCAG 2.2, Success Criterion 2.4.4 Link Purpose (In Context)
source_url: https://www.w3.org/WAI/WCAG22/Understanding/link-purpose-in-context.html
examples:
  should_flag:
    - To apply, click here.
    - Read more.
    - For details, click this link.
  should_not_flag:
    - We want students to read more books this summer.
    - Apply on the careers page of our website.
