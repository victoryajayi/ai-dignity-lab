id: ACC-LINK-002
lens: access
category: link and instruction clarity
severity: medium
match_type: regex
patterns:
  - '\blearn more\b(?=\s*(?:[.!:)\]>]|$))'
  - '\bmore info(?:rmation)?\b(?=\s*(?:[.!:)\]>]|$))'
  - '\b(?:visit|follow|use|open) this link\b'
applies_to: [all]
why: >
  Like 'click here', link text such as 'learn more' or 'this link' gives
  a screen reader user no idea where the link goes.
who_is_affected: Screen reader users and people with cognitive disabilities
suggestion: >
  Make the link text name its destination, for example 'Learn more about
  our refund policy'.
source_title: WCAG 2.2, Success Criterion 2.4.4 Link Purpose (In Context)
source_url: https://www.w3.org/WAI/WCAG22/Understanding/link-purpose-in-context.html
examples:
  should_flag:
    - Learn more.
    - To register, visit this link.
  should_not_flag:
    - Learn more about our refund policy.
    - Students learn more when they read every day.
